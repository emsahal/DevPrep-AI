# ========================================================
# Render Blueprint — DevPrep AI
# ========================================================
# Deploy: Push this file to your repo root, then connect
# the repo to Render. It will auto-detect this blueprint.
#
# After first deploy:
#   1. Set GEMINI_API_KEY in the Render dashboard (Environment tab)
#   2. Set FRONTEND_URL to your Vercel frontend URL
#   3. Run `npx prisma db push` locally against the Render DB
#      to create tables, then seed manually if needed.
# ========================================================

services:
  # ── Backend API ─────────────────────────────────────────
  - type: web
    name: devprep-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: DATABASE_URL
        fromDatabase:
          name: devprep-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: devprep-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRY
        value: "15m"
      - key: JWT_REFRESH_EXPIRY
        value: "7d"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: UPLOAD_DIR
        value: "uploads"
      - key: MAX_FILE_SIZE
        value: "5242880"

  # ── Redis ───────────────────────────────────────────────
  - type: redis
    name: devprep-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

# ── PostgreSQL Database ─────────────────────────────────
databases:
  - name: devprep-db
    plan: free
    databaseName: interview_prep
    user: devprep
