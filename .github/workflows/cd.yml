# ========================================================
# DevPrep AI — CD Pipeline (Deploy)
# ========================================================
# Triggers ONLY on push to main AND after CI passes.
# Deploys backend to Render via deploy hook.
# Vercel auto-deploys from its GitHub integration.
# ========================================================
# SETUP:
#   1. Go to Render Dashboard → devprep-api → Settings → Build & Deploy
#   2. Copy the "Deploy Hook" URL
#   3. In your GitHub repo → Settings → Secrets → Actions
#   4. Add secret: RENDER_DEPLOY_HOOK_URL = <the URL you copied>
# ========================================================

name: CD

on:
  push:
    branches: [main]

# Only run CD after CI passes
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Wait for CI ─────────────────────────────────────────
  ci:
    name: Run CI checks
    uses: ./.github/workflows/ci.yml

  # ── Deploy Backend to Render ────────────────────────────
  deploy-backend:
    name: Deploy Backend → Render
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render deploy
        run: |
          echo "🚀 Triggering Render deployment..."
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -H "Accept: application/json" \
            -o /dev/null -w "HTTP Status: %{http_code}\n"
          echo "✅ Deploy triggered — check Render dashboard for progress"

  # ── Deploy Frontend to Vercel ───────────────────────────
  # Vercel auto-deploys on push to main via its GitHub integration.
  # No action needed here. This job is a no-op status check.
  deploy-frontend:
    name: Deploy Frontend → Vercel
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Vercel auto-deploy
        run: |
          echo "✅ Vercel deploys automatically via GitHub integration."
          echo "   No manual trigger needed."
